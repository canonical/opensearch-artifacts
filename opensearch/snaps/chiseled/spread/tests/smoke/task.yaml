summary: OpenSearch Chiseled Snap Smoke Test

execute: |
  # The install hook configures and starts the cluster: check that
  # OpenSearch is up and ships the expected plugins.

  PASSWORDS=/var/snap/opensearch-chiseled/common/init_users_pass.yaml
  ADMIN_PASSWORD=$(sed -n 's/^admin: "\(.*\)"$/\1/p' "$PASSWORDS")
  URL=https://localhost:9200

  retry=0
  until [ "$(curl -sk -o /dev/null -w '%{http_code}' \
    "$URL"/.opendistro_security -u "admin:$ADMIN_PASSWORD")" = "200" ]; do
    retry=$((retry + 1))
    if [ $retry -ge 60 ]; then
      echo "OpenSearch did not become ready in time"
      snap logs opensearch-chiseled.daemon -n=50 || true
      exit 1
    fi
    sleep 2
  done

  snap run opensearch-chiseled.test-node-up \
    --node-name "opensearch-$(hostname)" \
    --admin-auth-password "$ADMIN_PASSWORD"
  snap run opensearch-chiseled.test-cluster-health-green \
    --admin-auth-password "$ADMIN_PASSWORD"
  snap run opensearch-chiseled.test-security-index-created \
    --admin-auth-password "$ADMIN_PASSWORD"

  # Only the security plugin is shipped
  plugins=$(curl -sk "$URL/_cat/plugins?h=component" \
    -u "admin:$ADMIN_PASSWORD")
  echo "$plugins"
  if [ "$plugins" != "opensearch-security" ]; then
    echo "FAIL: only opensearch-security should be shipped"
    exit 1
  fi
