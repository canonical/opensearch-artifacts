summary: OpenSearch Standard Snap Reconfiguration Test

environment:
  NODE_NAME: node-1
  CLUSTER_NAME: reconfigured-cluster

execute: |
  # The install hook bootstrapped a cluster with self-generated
  # certificates. Wait for it to be up, then re-configure it, as
  # documented in the README.

  CONF_DIR=/var/snap/opensearch/common/etc/opensearch
  CERTS_DIR="$CONF_DIR"/certificates

  wait_for_api () {
    local retry=0
    until curl -sk https://localhost:9200 >/dev/null 2>&1; do
      retry=$((retry + 1))
      if [ $retry -ge 60 ]; then
        echo "OpenSearch daemon did not become ready in time"
        snap logs opensearch.daemon -n=50 || true
        exit 1
      fi
      sleep 2
    done
  }

  wait_for_security_index () {
    local retry=0
    until [ "$(curl -sk -o /dev/null -w '%{http_code}' \
      https://localhost:9200/.opendistro_security -u admin:admin)" = "200" ]; do
      retry=$((retry + 1))
      if [ $retry -ge 60 ]; then
        echo "Security index was not ready in time"
        snap logs opensearch.daemon -n=50 || true
        exit 1
      fi
      sleep 2
    done
  }

  # Runs a script shipped by the snap with the environment of the snap
  in_snap () {
    snap run --shell opensearch.setup -c "$@"
  }

  # tls_init <root-key-pass> <admin-key-pass>: re-issues the root and admin
  # certificates, empty passwords generate unencrypted keys
  tls_init () {
    in_snap 'bash "$OPS_ROOT"/security/tls/self-managed-init.sh \
      --root-password "'"$1"'" --admin-password "'"$2"'" \
      --root-subject "" --admin-subject "" \
      --rest-with-tls yes --target-dir "$OPENSEARCH_PATH_CERTS"'
  }

  # tls_node <name> <root-key-pass> <node-key-pass>: re-issues the node
  # certificate, signed by the current root
  tls_node () {
    in_snap 'bash "$OPS_ROOT"/security/tls/self-managed-node.sh \
      --name "'"$1"'" --root-password "'"$2"'" --node-password "'"$3"'" \
      --node-subject "" --rest-with-tls yes \
      --target-dir "$OPENSEARCH_PATH_CERTS"'
  }

  # The certificates are read by the daemon, running as snap_daemon
  fix_certs_ownership () {
    chown snap_daemon "$CERTS_DIR"/*
    chmod 664 "$CERTS_DIR"/*.pem
  }

  wait_for_api
  wait_for_security_index

  # Cluster and node settings must be reconfigurable, upstream style:
  # scalars, comma separated lists and the removal of a setting.
  snap run opensearch.setup \
    -Ecluster.name="$CLUSTER_NAME" \
    -Enode.name="$NODE_NAME" \
    -Enode.roles=cluster_manager,data \
    -Ecluster.initial_cluster_manager_nodes="$NODE_NAME" \
    -Ehttp.port=9200

  # Comma separated values must be written as YAML lists
  roles=$(sed -n '/^node.roles:/,/^[^ -]/p' "$CONF_DIR"/opensearch.yml)
  echo "node.roles config: ${roles}"
  for role in cluster_manager data; do
    if ! echo "$roles" | grep -q -- "- ${role}"; then
      echo "FAIL: node.roles must contain ${role} as a list entry"
      exit 1
    fi
  done

  snap restart opensearch.daemon
  wait_for_api
  wait_for_security_index

  # The node must run under the new name, in the renamed cluster
  snap run opensearch.test-node-up --node-name "$NODE_NAME"
  snap run opensearch.test-cluster-health-green
  snap run opensearch.test-security-index-created

  cluster_name=$(curl -sk -u admin:admin https://localhost:9200 \
    | grep -o "\"cluster_name\" *: *\"[^\"]*\"")
  echo "reported ${cluster_name}"
  if ! echo "$cluster_name" | grep -q "$CLUSTER_NAME"; then
    echo "FAIL: cluster.name was not applied"
    exit 1
  fi

  # An empty value removes a setting: a node joining an already
  # bootstrapped cluster must be able to drop the bootstrap setting.
  snap run opensearch.setup -Ecluster.initial_cluster_manager_nodes=
  if grep -q "^cluster.initial_cluster_manager_nodes" "$CONF_DIR"/opensearch.yml; then
    echo "FAIL: cluster.initial_cluster_manager_nodes should have been removed"
    exit 1
  fi

  # The auto-generated certificates must be replaceable: re-issue them for
  # the new node name (the generated keys are unencrypted).
  tls_init "" ""
  tls_node "$NODE_NAME" "" ""
  fix_certs_ownership

  snap restart opensearch.daemon
  wait_for_api

  # Re-initialize the security index with the new admin certificate
  snap run opensearch.security-init
  wait_for_security_index

  snap run opensearch.test-node-up --node-name "$NODE_NAME"
  snap run opensearch.test-cluster-health-green
  snap run opensearch.test-security-index-created

  # The node certificate allowlist must contain exactly one DN (no stale
  # entries from the certificate generated by the install hook).
  nodes_dn=$(grep -A3 "nodes_dn" "$CONF_DIR"/opensearch.yml)
  echo "nodes_dn config: ${nodes_dn}"
  if [ "$(echo "$nodes_dn" | grep -o "CN=" | wc -l)" -ne 1 ]; then
    echo "FAIL: nodes_dn must contain exactly one DN after reconfiguration"
    exit 1
  fi

  # Users must also be able to opt into encrypted private keys
  tls_init root1234 admin1234
  tls_node "$NODE_NAME" root1234 node1234
  fix_certs_ownership

  encrypted_keys=(
    "$CERTS_DIR"/root-ca-key.pem
    "$CERTS_DIR"/admin-key.pem
    "$CERTS_DIR"/node-"$NODE_NAME"-key.pem
  )
  for key in "${encrypted_keys[@]}"; do
    if ! grep -q "ENCRYPTED" "$key"; then
      echo "FAIL: ${key} should be encrypted"
      exit 1
    fi
  done

  snap restart opensearch.daemon
  wait_for_api

  # security-init must accept the admin key passphrase for encrypted keys
  snap run opensearch.security-init --tls-priv-key-admin-pass admin1234
  wait_for_security_index

  snap run opensearch.test-node-up --node-name "$NODE_NAME"
  snap run opensearch.test-cluster-health-green
  snap run opensearch.test-security-index-created

  echo "All reconfiguration tests passed."
