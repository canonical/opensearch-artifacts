summary: OpenSearch Standard Snap Smoke Test

execute: |
  # The install hook configures and starts the cluster: check that
  # OpenSearch is up and ships the expected plugins.

  PASSWORDS=/var/snap/opensearch/common/init_users_pass.yaml
  ADMIN_PASSWORD=$(sed -n 's/^admin: "\(.*\)"$/\1/p' "$PASSWORDS")
  URL=https://localhost:9200

  retry=0
  until [ "$(curl -sk -o /dev/null -w '%{http_code}' \
    "$URL"/.opendistro_security -u "admin:$ADMIN_PASSWORD")" = "200" ]; do
    retry=$((retry + 1))
    if [ $retry -ge 60 ]; then
      echo "OpenSearch did not become ready in time"
      snap logs opensearch.daemon -n=50 || true
      exit 1
    fi
    sleep 2
  done

  snap run opensearch.test-node-up --node-name "opensearch-$(hostname)" \
    --admin-auth-password "$ADMIN_PASSWORD"
  snap run opensearch.test-cluster-health-green \
    --admin-auth-password "$ADMIN_PASSWORD"
  snap run opensearch.test-security-index-created \
    --admin-auth-password "$ADMIN_PASSWORD"

  # All the bundled plugins are shipped, except these
  plugins=$(curl -sk "$URL/_cat/plugins?h=component" \
    -u "admin:$ADMIN_PASSWORD")
  echo "$plugins"
  for p in repository-s3 repository-azure repository-gcs prometheus-exporter; do
    if echo "$plugins" | grep -qx "$p"; then
      echo "FAIL: ${p} should not be shipped"
      exit 1
    fi
  done
  for p in opensearch-security opensearch-performance-analyzer; do
    if ! echo "$plugins" | grep -qx "$p"; then
      echo "FAIL: ${p} should be shipped"
      exit 1
    fi
  done
  if [ "$(echo "$plugins" | wc -l)" -lt 20 ]; then
    echo "FAIL: expected at least 20 plugins"
    exit 1
  fi
