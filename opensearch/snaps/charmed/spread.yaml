project: opensearch-charmed-snap

backends:
  craft:
    type: craft
    systems:
      - ubuntu-26.04

suites:
  spread/tests/:
    summary: General integration tests
    prepare-each: |
      apt install -y curl yq
      snap install "$CRAFT_ARTIFACT" --dangerous
      bash "$(dirname "$CRAFT_ARTIFACT")/setup-dev-env.sh"
    restore-each: |
      snap remove opensearch-charmed --purge

exclude:
  - .git

kill-timeout: 1h
