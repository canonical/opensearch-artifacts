summary: Charmed OpenSearch Snap Smoke Test

execute: |

  # Allow the daemon to set sysctl properties at startup
  snap set charmed-opensearch set-sysctl-props=yes

  # Disable security for the smoke test (avoids needing TLS certs and
  # security index initialization that the charm would normally handle).
  snap set charmed-opensearch init-security=no

  # Configure the minimum settings for a single-node cluster.
  # yamllint disable rule:line-length
  SNAP_DATA_CURRENT=/var/snap/charmed-opensearch/current
  # yamllint enable rule:line-length
  opensearch_yaml="${SNAP_DATA_CURRENT}/etc/opensearch/opensearch.yml"
  yq="yq"

  $yq -y -i ".cluster.name = \"smoke-cluster\"" "${opensearch_yaml}"
  $yq -y -i ".node.name = \"cm0\"" "${opensearch_yaml}"
  $yq -y -i ".node.roles = [\"cluster_manager\", \"data\"]" "${opensearch_yaml}"
  $yq -y -i ".network.host = \"127.0.0.1\"" "${opensearch_yaml}"
  $yq -y -i ".discovery.seed_hosts = [\"127.0.0.1\"]" "${opensearch_yaml}"
  $yq -y -i ".cluster.initial_cluster_manager_nodes = [\"cm0\"]" \
    "${opensearch_yaml}"
  $yq -y -i ".plugins.security.disabled = true" "${opensearch_yaml}"

  # Start the daemon
  snap start charmed-opensearch.daemon

  # Wait for the REST API to be reachable (HTTP, not HTTPS, because
  # security is disabled).
  retry=0
  until curl -s http://localhost:9200 >/dev/null 2>&1; do
    retry=$((retry + 1))
    if [ $retry -ge 60 ]; then
      echo "OpenSearch daemon did not become ready in time"
      snap logs charmed-opensearch.daemon -n=50 || true
      exit 1
    fi
    sleep 2
  done

  # Verify the cluster responds
  echo "=== Cluster info ==="
  curl -s http://localhost:9200

  # Verify cluster name
  cluster_name=$(curl -s http://localhost:9200 | yq -r .cluster_name)
  if [ "${cluster_name}" != "smoke-cluster" ]; then
    echo "FAIL: Expected cluster name 'smoke-cluster', got '${cluster_name}'"
    exit 1
  fi

  echo "All smoke tests passed."
