name: opensearch-chiseled # the name of your ROCK
base: ubuntu@24.04 # the base environment for this ROCK
license: Apache-2.0

version: '2.19.6' # just for humans. Semantic versioning is recommended

summary: 'OpenSearch Chiseled ROCK OCI.'
description: |
  OpenSearch is a community-driven, Apache 2.0-licensed open source search
  and analytics suite that makes it easy to ingest, search, visualize, and
  analyze data. Developers build with OpenSearch for use cases such as
  application search, log analytics, data observability, data ingestion,
  and more.

  This rock is built from the opensearch-chiseled snap, which ships only the
  security plugin. All other bundled plugins, including k-NN and the
  performance analyzer, are removed.

platforms: # The platforms this ROCK should be built on and run on
  amd64:
  arm64:

run_user: _daemon_

environment:
  OPENSEARCH_HOME: /usr/share/opensearch

  JAVA_HOME: /usr/lib/jvm/java-21-openjdk
  OPENSEARCH_JAVA_HOME: /usr/lib/jvm/java-21-openjdk
  OPENSEARCH_BIN: /usr/share/opensearch/bin
  OPENSEARCH_LIB: /usr/share/opensearch/lib
  OPENSEARCH_PLUGINS: /usr/share/opensearch/plugins
  OPENSEARCH_MODULES: /usr/share/opensearch/modules

  OPENSEARCH_PATH_CONF: /etc/opensearch
  OPENSEARCH_PATH_CERTS: /etc/opensearch/certificates

  OPENSEARCH_VARLIB: /var/lib/opensearch
  OPENSEARCH_TMPDIR: /usr/share/tmp
  OPENSEARCH_VARLOG: /var/log/opensearch

services:
  opensearch:
    override: replace
    startup: enabled
    summary: Start OpenSearch
    command: '/bin/bash /bin/start.sh'

parts:
  opensearch-snap:
    plugin: nil
    # TEMPORARY: build against the local unpublished snap. Revert to
    # "stage-snaps: [opensearch-chiseled/2/edge]" and drop override-build.
    override-build: |
      craftctl default

      # Unpack the local snap, replicating what stage-snaps does:
      # extract content and rename the meta and snap directories.
      # Extraction merges through usrmerge symlinks (lib -> usr/lib)
      # like craft-parts' link_or_copy_tree does.
      snap_file="${CRAFT_PROJECT_DIR}/opensearch-chiseled_2.19.6_${CRAFT_ARCH_BUILD_FOR}.snap"
      temp_dir="$(mktemp -d)"
      unsquashfs -force -dest "${temp_dir}" "${snap_file}"
      mv "${temp_dir}/meta" "${temp_dir}/meta.opensearch-chiseled"
      mv "${temp_dir}/snap" "${temp_dir}/snap.opensearch-chiseled"
      ( cd "${temp_dir}" && tar -cf - . ) \
        | tar -xf - -C "${CRAFT_PART_INSTALL}" --keep-directory-symlink
      rm -rf "${temp_dir}"
    stage-packages:
      - base-files
      - python3-venv
      - python3-yaml
      - curl
      - lsof
      - util-linux
    override-prime: |
      craftctl default

      # opensearch
      mkdir -p data
      mkdir -p extensions

      # enable security monitoring
      rocks=usr/share/rocks/
      mkdir -p ${rocks}

      # move original plugin and keystore binary
      mv "${CRAFT_PRIME}/usr/share/opensearch/bin/opensearch-plugin.orig" \
          "${CRAFT_PRIME}/usr/share/opensearch/bin/opensearch-plugin"
      mv "${CRAFT_PRIME}/usr/share/opensearch/bin/opensearch-keystore.orig" \
          "${CRAFT_PRIME}/usr/share/opensearch/bin/opensearch-keystore"

      ## for deb packages
      # Split across two lines for the 80-column limit. Single quotes are
      # required: these are dpkg field names, not shell variables.
      dpkg_fmt='${db:Status-Abbrev},${binary:Package},${Version}'
      dpkg_fmt="${dpkg_fmt},"'${source:Package},${Source:Version}\n'
      dpkg-query -f "${dpkg_fmt}" -W > ${rocks}/dpkg.query

      ## for snap packages
      cp snap.opensearch-chiseled/manifest.yaml ${rocks}
      cp snap.opensearch-chiseled/snapcraft.yaml ${rocks}

      # Symlink to the arch-specific JDK so JAVA_HOME is stable across
      # amd64 and arm64 builds (the snap ships java-21-openjdk-${arch}).
      ln -sf "java-21-openjdk-${CRAFT_ARCH_BUILD_FOR}" \
          "${CRAFT_PRIME}/usr/lib/jvm/java-21-openjdk"

  non-root-user:
    plugin: nil
    after: [opensearch-snap]
    override-prime: |
      craftctl default

      # --- Daemon user ---
      # Pebble's run_user requires a named user in /etc/passwd, not just a UID.
      if ! id -u _daemon_ >/dev/null 2>&1; then
        groupadd -g 584792 _daemon_ || true
        useradd -u 584792 -g 584792 -r -s /bin/false _daemon_ || true
      fi

      # --- Directory permissions ---
      mkdir -p /var/lib/opensearch /usr/share/tmp /var/log/opensearch
      mkdir -p /etc/opensearch/certificates
      install -d -o 584792 -g 584792 -m 770 \
          "${CRAFT_PRIME}/etc/opensearch" \
          "${CRAFT_PRIME}/opt/opensearch" \
          "${CRAFT_PRIME}/usr/share/opensearch" \
          "${CRAFT_PRIME}/var/lib/opensearch" \
          "${CRAFT_PRIME}/usr/share/tmp" \
          "${CRAFT_PRIME}/var/log/opensearch" \
          "${CRAFT_PRIME}/etc/opensearch/certificates"

      # No k-NN handling here, unlike the standard and charmed rocks: the
      # chiseled snap removes opensearch-knn, so there are no native
      # libraries to relocate.

      # --- CA truststore ---
      CONTAINER_CONF_DIR="/etc/opensearch"
      PRIME_CONF_DIR="${CRAFT_PRIME}${CONTAINER_CONF_DIR}"
      CACERTS_DEST="${PRIME_CONF_DIR}/certificates/cacerts.p12"
      PRIME_JAVA_HOME="${CRAFT_PRIME}/usr/lib/jvm/java-21-openjdk"

      "${PRIME_JAVA_HOME}/bin/keytool" \
          -importkeystore \
          -srckeystore "${PRIME_JAVA_HOME}/lib/security/cacerts" \
          -destkeystore "${CACERTS_DEST}" \
          -srcstoretype JKS \
          -deststoretype PKCS12 \
          -srcstorepass changeit \
          -deststorepass changeit \
          -noprompt

      chmod 660 "${CACERTS_DEST}"

      # --- JVM options ---
      JVM_OPTS="${PRIME_CONF_DIR}/jvm.options"
      JAVA_LIBRARY_PATH="/usr/java/packages/lib:/usr/lib64:/lib64:/lib:/usr/lib"

      TRUSTSTORE="${CONTAINER_CONF_DIR}/certificates/cacerts.p12"

      echo "-Djavax.net.ssl.trustStore=${TRUSTSTORE}" >> "${JVM_OPTS}"
      echo "-Djavax.net.ssl.trustStorePassword=changeit" >> "${JVM_OPTS}"
      echo "-Djava.library.path=${JAVA_LIBRARY_PATH}" >> "${JVM_OPTS}"
      chown -R 584792:584792 "${PRIME_CONF_DIR}"

  entry:
    plugin: dump
    source: scripts
    organize:
      start.sh: usr/bin/start.sh
      set_conf.py: usr/bin/set_conf.py
    stage:
      - usr/bin/start.sh
      - usr/bin/set_conf.py
