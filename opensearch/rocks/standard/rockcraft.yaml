name: opensearch # the name of your ROCK
base: ubuntu@24.04 # the base environment for this ROCK
license: Apache-2.0

version: "2.19.6" # just for humans. Semantic versioning is recommended

summary: "OpenSearch ROCK OCI."
description: |
  OpenSearch is a community-driven, Apache 2.0-licensed open source search and
   analytics suite that makes it easy to ingest, search, visualize,
   and analyze data.
  Developers build with OpenSearch for use cases such as application search,
   log analytics, data observability, data ingestion, and more.

platforms:
  amd64:
  arm64:

environment:
  OPENSEARCH_HOME: /usr/share/opensearch

  JAVA_HOME: /usr/lib/jvm/java-21-openjdk
  OPENSEARCH_JAVA_HOME: /usr/lib/jvm/java-21-openjdk
  OPENSEARCH_BIN: /usr/share/opensearch/bin
  OPENSEARCH_LIB: /usr/share/opensearch/lib
  OPENSEARCH_PLUGINS: /usr/share/opensearch/plugins
  OPENSEARCH_MODULES: /usr/share/opensearch/modules

  # Align on paths with upstream
  OPENSEARCH_PATH_CONF: /usr/share/opensearch/config
  OPENSEARCH_PATH_CERTS: /usr/share/opensearch/config/certificates

  OPENSEARCH_PATH_DATA: /usr/share/opensearch/data
  OPENSEARCH_TMPDIR: /usr/share/tmp
  OPENSEARCH_PATH_LOGS: /usr/share/opensearch/logs

  KNN_LIB_DIR: /usr/share/opensearch/plugins/opensearch-knn/lib

  # Align with upstream: expose the OpenSearch and JDK tools
  # (opensearch-keystore, opensearch-plugin, keytool...) on the PATH.
  PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:\
    /usr/lib/jvm/java-21-openjdk/bin:/usr/share/opensearch/bin"

  # Like upstream, print the OpenSearch output in the container logs
  PEBBLE_VERBOSE: "1"

services:
  opensearch:
    override: replace
    startup: enabled
    summary: Start OpenSearch
    command: "/bin/bash /bin/start.sh"
    user: opensearch
    group: opensearch
    working-dir: /usr/share/opensearch
    # Like upstream, the container exits when OpenSearch fails (e.g. on an
    # invalid initial admin password) instead of restarting it in a loop:
    # the restart is left to the container runtime.
    on-failure: shutdown

parts:
  user:
    plugin: nil
    overlay-script: |
      # The Ubuntu base already keeps an account at 1000:1000.
      userdel --root "${CRAFT_OVERLAY}" --force ubuntu 2>/dev/null || true
      groupdel --root "${CRAFT_OVERLAY}" ubuntu 2>/dev/null || true

      groupadd --root "${CRAFT_OVERLAY}" -r opensearch --gid=1000
      useradd --root "${CRAFT_OVERLAY}" -r -g opensearch --uid=1000 \
        --home-dir /usr/share/opensearch --shell /bin/bash opensearch

  opensearch-snap:
    plugin: nil
    after: [user]
    stage-snaps:
      - opensearch/2/edge
    stage-packages:
      - base-files
      - python3-venv
      - python3-yaml
      - curl
      - lsof
      - util-linux
      - yq
    override-prime: |
      craftctl default

      # opensearch
      mkdir -p usr/share/opensearch/data
      mkdir -p usr/share/opensearch/logs
      mkdir -p extensions

      # The official image keeps the configuration inside OPENSEARCH_HOME;
      # the snap stages it under /etc/opensearch.
      mv "${CRAFT_PRIME}/etc/opensearch" \
          "${CRAFT_PRIME}/usr/share/opensearch/config"

      # enable security monitoring
      rocks=usr/share/rocks/
      mkdir -p ${rocks}

      # move original plugin and keystore binary
      mv "${CRAFT_PRIME}/usr/share/opensearch/bin/opensearch-plugin.orig" \
       "${CRAFT_PRIME}/usr/share/opensearch/bin/opensearch-plugin"
      mv "${CRAFT_PRIME}/usr/share/opensearch/bin/opensearch-keystore.orig" \
       "${CRAFT_PRIME}/usr/share/opensearch/bin/opensearch-keystore"


      ## for deb packages
      FMT='${db:Status-Abbrev},${binary:Package},${Version},${source:Package}'
      FMT=$FMT',${Source:Version}\n'
      dpkg-query -f "$FMT" -W > ${rocks}/dpkg.query

      ## for snap packages
      cp snap.opensearch/manifest.yaml ${rocks}
      cp snap.opensearch/snapcraft.yaml ${rocks}

      # Symlink to the arch-specific JDK so JAVA_HOME is stable across
      # amd64 and arm64 builds (the snap ships java-21-openjdk-${arch}).
      ln -sf "java-21-openjdk-${CRAFT_ARCH_BUILD_FOR}" \
          "${CRAFT_PRIME}/usr/lib/jvm/java-21-openjdk"

      # Remove plugins not shipped in the standard rock using the
      # official opensearch-plugin utility.
      export JAVA_HOME="${CRAFT_PRIME}/usr/lib/jvm/java-21-openjdk"
      export OPENSEARCH_PATH_CONF="${CRAFT_PRIME}/usr/share/opensearch/config"

      declare -a plugins_to_remove=(
          "repository-s3"
          "repository-gcs"
          "repository-azure"
          "prometheus-exporter"
      )

      for plugin in "${plugins_to_remove[@]}"; do
          echo "Removing plugin: ${plugin}"
          "${CRAFT_PRIME}/usr/share/opensearch/bin/opensearch-plugin" \
              remove "${plugin}"
      done
      ls "${CRAFT_PRIME}/usr/share/opensearch/plugins"

  non-root-user:
    plugin: nil
    after: [opensearch-snap]
    override-prime: |
      craftctl default

      # --- Directory permissions ---
      for dir in opt/opensearch \
                 usr/share/opensearch \
                 usr/share/opensearch/config \
                 usr/share/opensearch/data \
                 usr/share/opensearch/logs \
                 usr/share/tmp \
                 usr/share/opensearch/config/certificates; do
          mkdir -p "${CRAFT_PRIME}/${dir}"
          chmod 770 "${CRAFT_PRIME}/${dir}"
          chown 1000:1000 "${CRAFT_PRIME}/${dir}"
      done

      # --- k-NN native libraries ---
      KNN_LIB_DIR="/usr/share/opensearch/plugins/opensearch-knn/lib"
      PRIME_KNN_LIB_DIR="${CRAFT_PRIME}${KNN_LIB_DIR}"

      chown -R 1000:1000 "${PRIME_KNN_LIB_DIR}"
      find "${PRIME_KNN_LIB_DIR}" -type d -exec chmod 755 {} \;
      find "${PRIME_KNN_LIB_DIR}" -type f -name '*.so*' -exec chmod 755 {} \;

      # Symlink into /usr/lib so the dynamic linker finds
      # them without LD_LIBRARY_PATH, which is stripped when
      # OpenSearch runs with elevated memory lock capabilities.
      mkdir -p "${CRAFT_PRIME}/usr/lib"
      for FILE in "${PRIME_KNN_LIB_DIR}"/*.so*; do
          ln -sf "${KNN_LIB_DIR}/$(basename "${FILE}")" \
           "${CRAFT_PRIME}/usr/lib/"
      done

      # --- Security plugin demo configuration ---
      # install_demo_configuration.sh drops securityadmin_demo.sh in here
      # on first start, as uid 1000.
      SECURITY_TOOLS_DIR="${CRAFT_PRIME}/usr/share/opensearch/plugins/opensearch-security/tools"
      chown 1000:1000 "${SECURITY_TOOLS_DIR}"
      chmod 755 "${SECURITY_TOOLS_DIR}"
      # Like upstream, make the security tools (securityadmin.sh, hash.sh,
      # audit_config_migrater.sh...) executable.
      chmod 755 "${SECURITY_TOOLS_DIR}"/*

      # --- CA truststore ---
      CONTAINER_CONF_DIR="/usr/share/opensearch/config"
      PRIME_CONF_DIR="${CRAFT_PRIME}${CONTAINER_CONF_DIR}"
      CACERTS_DEST="${PRIME_CONF_DIR}/certificates/cacerts.p12"
      PRIME_JAVA_HOME="${CRAFT_PRIME}/usr/lib/jvm/java-21-openjdk"

      "${PRIME_JAVA_HOME}/bin/keytool" \
          -importkeystore \
          -srckeystore "${PRIME_JAVA_HOME}/lib/security/cacerts" \
          -destkeystore "${CACERTS_DEST}" \
          -srcstoretype JKS \
          -deststoretype PKCS12 \
          -srcstorepass changeit \
          -deststorepass changeit \
          -noprompt

      chmod 660 "${CACERTS_DEST}"

      # --- JVM options ---
      JVM_OPTS="${PRIME_CONF_DIR}/jvm.options"
      JAVA_LIBRARY_PATH="${KNN_LIB_DIR}:/usr/java/packages/lib:/usr/lib64:/lib64:/lib:/usr/lib"
      SSL_OPT="-Djavax.net.ssl.trustStore="
      # Fixing yaml lint error line
      echo "$SSL_OPT${CONTAINER_CONF_DIR}/certificates/cacerts.p12" \
       >> "${JVM_OPTS}"
      echo "-Djavax.net.ssl.trustStorePassword=changeit" >> "${JVM_OPTS}"
      echo "-Djava.library.path=${JAVA_LIBRARY_PATH}" >> "${JVM_OPTS}"
      chown -R 1000:1000 "${PRIME_CONF_DIR}"

      # OpenSearch writes its keystore into the configuration directory on
      # startup, and its data and logs into the two below, all as uid 1000.
      chown -R 1000:1000 \
          "${CRAFT_PRIME}/usr/share/opensearch/data" \
          "${CRAFT_PRIME}/usr/share/opensearch/logs"

  entry:
    plugin: dump
    after: [non-root-user]
    source: scripts
    organize:
      start.sh: usr/bin/start.sh
      set_conf.py: usr/bin/set_conf.py
      init_users.py: usr/bin/init_users.py
    stage:
      - usr/bin/start.sh
      - usr/bin/set_conf.py
      - usr/bin/init_users.py
