summary: OpenSearch Rock Smoke Test

execute: |
  version="$(cat "${PROJECT_PATH}/rockcraft.yaml" | yq .version | tr -d '"')"

  # Same contract as the upstream image: the security plugin is enabled
  # with demo TLS certificates, and the admin password must be strong.
  admin_password="Sm0ke-Test_Pa55word!"
  auth=(-u "admin:${admin_password}")
  # A value is read whole: the line after the newline must not become a
  # setting disabling the security plugin
  kibanaserver_password=$'Sm0ke-Kibana_Pa55!\nplugins.security.disabled=true'

  # A node needs ~30s to answer HTTP even on fast hardware, so poll for
  # readiness instead of sleeping a fixed amount. Until the security index
  # is initialized, the node answers in plain text: ignore jq failures.
  wait_for_node() {
      port="$1"
      name="$2"
      for _ in $(seq 1 60); do
          reported="$(curl -sk --max-time 3 "https://127.0.0.1:${port}" \
              "${auth[@]}" | jq -r '.name // empty' 2>/dev/null || true)"
          if [ "${reported}" = "${name}" ]; then
              echo "${name} answered on port ${port}"
              return 0
          fi
          sleep 3
      done
      echo "Error: ${name} did not answer on port ${port} within 180s."
      docker logs --tail 50 "${name}" || true
      return 1
  }

  # Cluster formation lags node startup, so wait for the join to settle.
  wait_for_nodes_joined() {
      expected="$1"
      for _ in $(seq 1 60); do
          successful="$(curl -sk --max-time 3 https://127.0.0.1:9200/_nodes \
              "${auth[@]}" | jq -r '._nodes.successful // 0' 2>/dev/null \
              || true)"
          if [ "${successful}" = "${expected}" ]; then
              return 0
          fi
          sleep 3
      done
      echo "Error: only ${successful} of ${expected} nodes joined."
      return 1
  }

  # create first cm_node container
  container_0_id=$(docker run \
      -d --rm -it \
      -e OPENSEARCH_INITIAL_ADMIN_PASSWORD="${admin_password}" \
      -e OPENSEARCH_INITIAL_KIBANASERVER_PASSWORD="${kibanaserver_password}" \
      -e NODE_NAME=cm0 \
      -e INITIAL_CM_NODES=cm0 \
      -p 9200:9200 \
      --name cm0 \
      opensearch:"${version}")
  container_0_ip=$(docker inspect \
      -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' \
      "${container_0_id}")

  # wait for it to fully initialize
  wait_for_node 9200 cm0

  # create data/voting_only node container
  container_1_id=$(docker run \
      -d --rm -it \
      -e OPENSEARCH_INITIAL_ADMIN_PASSWORD="${admin_password}" \
      -e NODE_NAME=data1 \
      -e SEED_HOSTS="${container_0_ip}" \
      -e NODE_ROLES=data,voting_only \
      -p 9201:9200 \
      --name data1 \
      opensearch:"${version}")
  container_1_ip=$(docker inspect \
      -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' \
      "${container_1_id}")

  # wait for it to fully initialize
  wait_for_node 9201 data1

  # create 2nd cm_node container
  docker run \
      -d --rm -it \
      -e OPENSEARCH_INITIAL_ADMIN_PASSWORD="${admin_password}" \
      -e NODE_NAME=cm1 \
      -e SEED_HOSTS="${container_0_ip},${container_1_ip}" \
      -e INITIAL_CM_NODES="cm0,cm1" \
      -p 9202:9200 \
      --name cm1 \
      opensearch:"${version}"

  # wait for it to fully initialize
  wait_for_node 9202 cm1

  # test node
  cluster_resp=$(curl -sk -XGET https://127.0.0.1:9200 "${auth[@]}")
  echo -e "Cluster Response: \n ${cluster_resp}"
  node_name=$(echo "${cluster_resp}" | jq -r .name)
  if [ "${node_name}" != "cm0" ]; then
      echo "Error: Wrong node name."
      exit 1
  fi

  # query all nodes of cluster
  wait_for_nodes_joined 3
  successful_nodes="$(curl -sk -XGET https://127.0.0.1:9200/_nodes \
    "${auth[@]}" | jq ._nodes.successful)"
  echo "Successful nodes: ${successful_nodes}"
  if [ "${successful_nodes}" != 3 ]; then
      echo "Error: Wrong number of nodes."
      exit 1
  fi

  all_nodes="$(curl -sk -XGET https://127.0.0.1:9200/_nodes/ "${auth[@]}" | \
    jq '.nodes | values[] | .name' | \
    jq -s '. |= if . then sort else empty end' | \
    jq -r '. | values[]' | \
    paste -sd "," - \
  )"
  echo "All nodes: ${all_nodes}"
  if [ "${all_nodes}" != "cm0,cm1,data1" ]; then
      echo "Error: Wrong nodes in cluster."
      exit 1
  fi

  # Security must be enforced: no credentials, no answer.
  anon_status="$(curl -sk -o /dev/null -w '%{http_code}' \
    https://127.0.0.1:9200)"
  if [ "${anon_status}" != 401 ]; then
      echo "Error: anonymous request returned ${anon_status}, expected 401."
      exit 1
  fi

  # Plain HTTP must be refused now that TLS is on the REST layer.
  if curl -s --max-time 3 http://127.0.0.1:9200 >/dev/null; then
      echo "Error: REST layer still answers over plain HTTP."
      exit 1
  fi

  # The default cluster name of the rock's opensearch.yml
  cluster_name="$(curl -sk https://127.0.0.1:9200 "${auth[@]}" \
    | jq -r .cluster_name)"
  if [ "${cluster_name}" != "opensearch-cluster" ]; then
      echo "Error: cluster name is ${cluster_name}, expected opensearch-cluster."
      exit 1
  fi

  # The given password of a demo user, newline included, is the one set
  kibanaserver_status="$(curl -sk -o /dev/null -w '%{http_code}' \
    -u "kibanaserver:${kibanaserver_password}" \
    https://127.0.0.1:9200/_plugins/_security/authinfo)"
  if [ "${kibanaserver_status}" != 200 ]; then
      echo "Error: kibanaserver login returned ${kibanaserver_status}."
      exit 1
  fi

  # The passwords must not reach the logs
  if docker logs cm0 2>&1 | grep -F -e "${admin_password}" -e "Sm0ke-Kibana"; then
      echo "Error: a password is in the logs of cm0."
      exit 1
  fi

  # Without an admin password the container stops, and its logs say why
  docker run \
      -d -it \
      --name nopass \
      opensearch:"${version}"
  docker wait nopass
  if ! docker logs nopass 2>&1 | grep -q "No custom admin password found"; then
      echo "Error: the logs do not explain the failed start."
      docker logs --tail 50 nopass
      exit 1
  fi

  # A read-only opensearch.yml is kept as is
  cat > opensearch.yml <<EOF
  cluster.name: read-only-config
  network.host: 0.0.0.0
  discovery.type: single-node
  EOF
  chmod 444 opensearch.yml
  docker run \
      -d --rm -it \
      -e DISABLE_SECURITY_PLUGIN=true \
      -v "${PWD}/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro" \
      -p 9203:9200 \
      --name rocfg \
      opensearch:"${version}"
  for _ in $(seq 1 60); do
      cluster_name="$(curl -s --max-time 3 http://127.0.0.1:9203 \
        | jq -r '.cluster_name // empty' 2>/dev/null || true)"
      if [ -n "${cluster_name}" ]; then
          break
      fi
      sleep 3
  done
  if [ "${cluster_name}" != "read-only-config" ]; then
      echo "Error: cluster name is ${cluster_name}, expected read-only-config."
      docker logs --tail 50 rocfg || true
      exit 1
  fi

  echo "All smoke tests passed."
