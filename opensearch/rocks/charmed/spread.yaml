project: opensearch-charmed-rock

backends:
  craft:
    type: craft
    systems:
      - ubuntu-24.04

suites:
  spread/tests/:
    summary: General integration tests
    prepare-each: |
      apt update
      apt install -y curl jq docker.io
      snap install yq
      snap install rockcraft --classic --edge

      # Required kernel parameters for OpenSearch
      sysctl -w vm.swappiness=0
      sysctl -w vm.max_map_count=262144
      sysctl -w net.ipv4.tcp_retries2=5

      # Import the rock into docker
      version="$(cat "${PROJECT_PATH}/rockcraft.yaml" | yq .version)"
      rockcraft.skopeo --insecure-policy copy \
        oci-archive:"${CRAFT_ARTIFACT}" \
        docker-daemon:opensearch-charmed:"${version}"
    restore-each: |
      docker rm -f cm0 data1 cm1 2>/dev/null || true
      version="$(cat "${PROJECT_PATH}/rockcraft.yaml" | yq .version)"
      docker rmi opensearch-charmed:"${version}" 2>/dev/null || true

exclude:
  - .git

kill-timeout: 1h
