summary: OpenSearch Dashboards Rock Smoke Test

execute: |
  version="$(yq -r .version "${PROJECT_PATH}/rockcraft.yaml")"

  wait_for_opensearch() {
      for _ in $(seq 1 60); do
          reported="$(curl -sk --max-time 3 http://127.0.0.1:9200 \
              | jq -r '.name // empty')"
          if [ "${reported}" = "cm0" ]; then
              echo "OpenSearch answered on port 9200"
              return 0
          fi
          sleep 3
      done
      echo "Error: OpenSearch did not answer on port 9200 within 180s."
      docker exec cm0 \
          sh -c 'tail -50 /var/log/opensearch/*.log' || true
      return 1
  }

  status_resp=""
  wait_for_dashboards() {
      local resp state
      for _ in $(seq 1 100); do
          resp="$(curl -s --max-time 5 \
              http://127.0.0.1:5601/api/status || true)"
          state="$(echo "${resp}" \
              | jq -r '.status.overall.state // empty' 2>/dev/null || true)"
          if [ "${state}" = "green" ] || [ "${state}" = "yellow" ]; then
              status_resp="${resp}"
              echo "Dashboards is ready on port 5601 (state ${state})"
              return 0
          fi
          sleep 3
      done
      echo "Error: Dashboards did not become ready on port 5601 in time."
      echo "Last response: ${resp}"
      docker logs osd 2>&1 | tail -50 || true
      # Dashboards logs to a file, not stdout, so check that too.
      docker exec osd \
          sh -c 'tail -50 /var/log/opensearch-dashboards/*.log' || true
      return 1
  }

  # --- Start an OpenSearch backend from this repo --------------------------
  docker network create osd-net
  docker run \
      -d --rm -it \
      --network osd-net \
      -e NODE_NAME=cm0 \
      -e INITIAL_CM_NODES=cm0 \
      -p 9200:9200 \
      --name cm0 \
      opensearch:"${version}"
  os_ip="$(docker inspect \
      -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' cm0)"
  wait_for_opensearch

  # --- Start Dashboards wired to the OpenSearch backend --------------------
  docker run \
      -d --rm -it \
      --network osd-net \
      -e OPENSEARCH_HOSTS="[http://${os_ip}:9200]" \
      -p 5601:5601 \
      --name osd \
      opensearch-dashboards:"${version}"

  wait_for_dashboards

  running="$(docker inspect -f '{{.State.Running}}' osd)"
  if [ "${running}" != "true" ]; then
      echo "Error: container is not running (State.Running=${running})."
      docker logs osd 2>&1 | tail -50 || true
      exit 1
  fi

  echo "=== pebble services ==="
  docker exec osd /usr/bin/pebble services

  osd_status="$(docker exec osd /usr/bin/pebble services \
      | awk '$1 == "opensearch-dashboards" {print $3}')"
  if [ "${osd_status}" != "active" ]; then
      echo "Error: opensearch-dashboards service is '${osd_status}'."
      docker exec osd /usr/bin/pebble services || true
      docker logs osd 2>&1 | tail -50 || true
      exit 1
  fi
  echo "opensearch-dashboards service is active"

  logfile="/var/log/opensearch-dashboards/opensearch_dashboards.log"
  if ! docker exec osd test -s "${logfile}"; then
      echo "Error: ${logfile} is missing or empty."
      docker exec osd ls -l /var/log/opensearch-dashboards/ || true
      exit 1
  fi
  echo "Dashboards is writing to ${logfile}"

  echo -e "Status Response: \n ${status_resp}"

  # --- Integration: Dashboards must be talking to OpenSearch ---------------
  dashboards_version="$(echo "${status_resp}" \
      | jq -r '.version.number // empty')"
  if [ "${dashboards_version}" != "${version}" ]; then
      echo "Error: /api/status reports version '${dashboards_version}'" \
        "!= ${version}."
      exit 1
  fi
  echo "Dashboards reports version ${dashboards_version} via /api/status"

  # The overall status only reaches an available state once Dashboards has
  # successfully connected to its OpenSearch backend.
  overall_state="$(echo "${status_resp}" \
      | jq -r '.status.overall.state // empty')"
  if [ "${overall_state}" != "green" ] && \
     [ "${overall_state}" != "yellow" ]; then
      echo "Error: Dashboards overall state is '${overall_state}'" \
        "(expected green/yellow), so it is not connected to OpenSearch."
      exit 1
  fi
  echo "Dashboards overall state is '${overall_state}' (backend connected)"

  # Confirm OpenSearch is genuinely reachable and serving from the backend.
  os_resp="$(curl -sk --max-time 10 http://127.0.0.1:9200)"
  os_tagline="$(echo "${os_resp}" | jq -r '.tagline // empty')"
  os_version="$(echo "${os_resp}" | jq -r '.version.number')"
  if [ "${os_tagline}" != \
       "The OpenSearch Project: https://opensearch.org/" ]; then
      echo "Error: OpenSearch backend did not respond as expected."
      echo "${os_resp}"
      exit 1
  fi
  echo "OpenSearch backend is up: ${os_version}"

  echo "All smoke tests passed."
