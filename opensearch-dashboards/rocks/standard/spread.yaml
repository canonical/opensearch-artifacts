project: opensearch-dashboards-rock

backends:
  craft:
    type: craft
    systems:
      - ubuntu-24.04

suites:
  spread/tests/:
    summary: General integration tests
    prepare-each: |
      apt update
      apt install -y curl jq
      # Docker may already be present on CI runners as docker-ce +
      # containerd.io. Installing docker.io there fails (containerd.io
      # Conflicts: containerd), so only install the packaged Docker when no
      # docker binary is present (e.g. a fresh LXD VM from the craft backend).
      if ! command -v docker >/dev/null 2>&1; then
        apt install -y docker.io
      fi
      snap install yq
      snap install rockcraft --classic --edge

      # Importing the rock inflates it in the Docker storage driver. Reclaim
      # whatever the runner image left behind first, otherwise the daemon runs
      # out of space mid-import and skopeo reports the resulting broken pipe as
      # `writing blob: io: read/write on closed pipe`.
      docker system prune --all --force || true
      df -h /

      # Import the rock into docker
      version="$(cat "${PROJECT_PATH}/rockcraft.yaml" \
        | yq .version | tr -d '"')"
      if ! rockcraft.skopeo --insecure-policy copy \
        oci-archive:"${CRAFT_ARTIFACT}" \
        docker-daemon:opensearch-dashboards:"${version}"; then
        echo "Failed to import the rock into Docker."
        df -h /
        docker system df || true
        journalctl --no-pager --unit docker --lines 100 || true
        exit 1
      fi

      # The packed project still holds a copy of the rock we no longer need.
      rm -f "${CRAFT_ARTIFACT}"
      df -h /
    restore-each: |
      docker rm -f dashboards 2>/dev/null || true
      version="$(cat "${PROJECT_PATH}/rockcraft.yaml" \
        | yq .version | tr -d '"')"
      docker rmi opensearch-dashboards:"${version}" 2>/dev/null || true

exclude:
  - .git

kill-timeout: 1h
