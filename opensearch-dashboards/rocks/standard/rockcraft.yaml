name: opensearch-dashboards
base: ubuntu@26.04 # the base environment for this rock
license: Apache-2.0

version: '3.8.0' # just for humans. Semantic versioning is recommended

# yamllint disable-line rule:line-length
summary: 'OpenSearch Dashboards: community-driven OpenSearch visualization suite.'
description: |
    OpenSearch Dashboard is a community-driven, Apache 2.0-licensed open
    source user interface that lets you visualize your OpenSearch data and
    run and scale your OpenSearch clusters.

platforms: # the platforms this rock should be built on and run on
  amd64:
  arm64:

run_user: _daemon_

environment:
  OPENSEARCH_DASHBOARDS_HOME: /usr/share/opensearch-dashboards
  OPENSEARCH_DASHBOARDS_BIN: /usr/share/opensearch-dashboards/bin
  NODE_HOME: /usr/share/opensearch-dashboards/node
  OPENSEARCH_DASHBOARDS_PATH_CONF: /usr/share/opensearch-dashboards/config
  OSD_PATH_CONF: /usr/share/opensearch-dashboards/config
  PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:\
    /usr/share/opensearch-dashboards/bin"
  PEBBLE_VERBOSE: "1"

services:
  opensearch-dashboards:
    override: replace
    startup: enabled
    summary: Start OpenSearch Dashboards
    command: '/bin/bash /bin/start.sh'
    user: _daemon_
    group: _daemon_
    working-dir: /usr/share/opensearch-dashboards
    on-success: shutdown
    on-failure: shutdown
    kill-delay: 30s

parts:
  opensearch-dashboards-snap:
    plugin: nil
    stage-snaps:
      - opensearch-dashboards/3/edge
    stage:
      - "-opt/opensearch-dashboards"
      - "-config"
    stage-packages:
      - util-linux
      - python3-venv
      - curl
    override-build: |
      craftctl default

      OSD_HOME="${CRAFT_PART_INSTALL}/usr/share/opensearch-dashboards"

      mv "${CRAFT_PART_INSTALL}/etc/opensearch-dashboards" "${OSD_HOME}/config"

      rm -f "${OSD_HOME}/plugins"
      mv "${OSD_HOME}/shipped-plugins" "${OSD_HOME}/plugins"

      printf "\nserver.host: '0.0.0.0'\n" >> \
          "${OSD_HOME}/config/opensearch_dashboards.yml"
    override-prime: |
      craftctl default

      # enable security monitoring
      rocks=usr/share/rocks/
      mkdir -p ${rocks}

      ## for deb packages
      # Split across two lines for the 80-column limit. Single quotes are
      # required: these are dpkg field names, not shell variables.
      dpkg_fmt='${db:Status-Abbrev},${binary:Package},${Version}'
      dpkg_fmt="${dpkg_fmt},"'${source:Package},${Source:Version}\n'
      dpkg-query -f "${dpkg_fmt}" -W > ${rocks}/dpkg.query

      ## for snap packages
      cp snap.opensearch-dashboards/manifest.yaml ${rocks}
      cp snap.opensearch-dashboards/snapcraft.yaml ${rocks}

  non-root-user:
    plugin: nil
    after: [opensearch-dashboards-snap]
    override-prime: |
      craftctl default

      OSD_HOME="${CRAFT_PRIME}/usr/share/opensearch-dashboards"

      # --- Directory permissions ---
      # Like upstream, the home belongs to the OpenSearch Dashboards user,
      # which writes its data and its keystore, and installs and removes
      # plugins, all as _daemon_.
      mkdir -p "${OSD_HOME}/data"
      chown -R 584792:584792 "${OSD_HOME}"

      chmod 770 "${OSD_HOME}/config" "${OSD_HOME}/data"
      chmod -R 755 "${OSD_HOME}/bin"

  entry:
    plugin: dump
    after: [non-root-user]
    source: scripts
    organize:
      start.sh: usr/bin/start.sh
    stage:
      - usr/bin/start.sh
