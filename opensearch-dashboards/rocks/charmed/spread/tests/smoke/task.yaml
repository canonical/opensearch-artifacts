summary: Charmed OpenSearch Dashboards Rock Smoke Test

execute: |
  version="$(yq -r .version "${PROJECT_PATH}/rockcraft.yaml")"

  # Go template used to read a container's IP address.
  ip_format='{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}'

  dump_diagnostics() {
      echo "--- container state"
      docker inspect \
          -f 'status={{.State.Status}} exit={{.State.ExitCode}}' \
          dashboards || true
      echo "--- pebble services"
      docker exec dashboards /usr/bin/pebble services || true
      echo "--- container logs"
      docker logs dashboards 2>&1 | tail -50 || true
      echo "--- dashboards log file"
      docker exec dashboards \
          sh -c 'tail -50 /var/log/opensearch-dashboards/*.log' || true
      echo "--- effective configuration"
      docker exec dashboards \
          cat /etc/opensearch-dashboards/opensearch_dashboards.yml || true
  }

  wait_for_opensearch() {
      local reported
      for _ in $(seq 60); do
          reported="$(curl -sk --max-time 3 http://127.0.0.1:9200 \
              | jq -r '.name // empty')"
          if [ "${reported}" = "cm0" ]; then
              echo "OpenSearch answered on port 9200"
              return 0
          fi
          sleep 3
      done
      echo "Error: OpenSearch did not answer on port 9200 within 180s."
      docker logs cm0 2>&1 | tail -50 || true
      return 1
  }

  # Set by wait_for_dashboards to the /api/status body it accepted.
  status_resp=""
  wait_for_dashboards() {
      local resp state
      for _ in $(seq 100); do
          state="$(docker inspect -f '{{.State.Status}}' dashboards)"
          if [ "${state}" != "running" ]; then
              echo "Error: container is '${state}', expected 'running'."
              dump_diagnostics
              return 1
          fi
          resp="$(curl -s --max-time 5 \
              http://127.0.0.1:5601/api/status || true)"
          state="$(echo "${resp}" \
              | jq -r '.status.overall.state // empty' 2>/dev/null || true)"
          # Dashboards only leaves 'red' once it has reached OpenSearch, so
          # green/yellow already proves the two are talking to each other.
          if [ "${state}" = "green" ] || [ "${state}" = "yellow" ]; then
              status_resp="${resp}"
              echo "Dashboards is ready on port 5601 (state ${state})"
              return 0
          fi
          sleep 3
      done
      echo "Error: Dashboards did not become ready on port 5601 in time."
      echo "Last response: ${resp}"
      dump_diagnostics
      return 1
  }

  exporter_metrics=""
  wait_for_exporter() {
      for _ in $(seq 20); do
          exporter_metrics="$(curl -s --max-time 5 \
              http://127.0.0.1:9684/metrics || true)"
          if echo "${exporter_metrics}" \
              | grep -q '^opensearch_dashboards_up '; then
              echo "Exporter answered on port 9684"
              return 0
          fi
          sleep 3
      done
      echo "Error: exporter did not serve metrics on port 9684 within 60s."
      echo "Last response: ${exporter_metrics}"
      dump_diagnostics
      return 1
  }

  check_pebble_service() {
      local name="${1}" services
      services="$(docker exec dashboards /usr/bin/pebble services)"
      if ! echo "${services}" | grep -qE "^${name} +enabled +active"; then
          echo "Error: pebble service '${name}' is not active."
          echo "${services}"
          dump_diagnostics
          exit 1
      fi
      echo "Pebble service '${name}' is active"
  }

  # --- OpenSearch ----------------------------------------------------------
  docker network create osd-net
  docker run -d \
      --network osd-net \
      -e NODE_NAME=cm0 \
      -e INITIAL_CM_NODES=cm0 \
      -p 9200:9200 \
      --name cm0 \
      opensearch:"${version}"
  os_ip="$(docker inspect -f "${ip_format}" cm0)"
  wait_for_opensearch

  # --- Dashboards ----------------------------------------------------------
  docker run -d \
      --network osd-net \
      -e OPENSEARCH_HOSTS="[http://${os_ip}:9200]" \
      -p 5601:5601 \
      -p 9684:9684 \
      --name dashboards \
      opensearch-dashboards-charmed:"${version}"

  wait_for_dashboards

  # Both services are 'startup: enabled', so Pebble must report both active.
  check_pebble_service opensearch-dashboards
  check_pebble_service prometheus-exporter

  # --- Dashboards reports itself healthy and on the expected version -------
  echo -e "Status Response: \n ${status_resp}"

  reported="$(echo "${status_resp}" | jq -r '.version.number // empty')"
  if [ "${reported}" != "${version}" ]; then
      echo "Error: /api/status reports version '${reported}'" \
        "!= rock ${version}."
      exit 1
  fi
  echo "Dashboards reports version ${reported} via /api/status"

  overall_state="$(echo "${status_resp}" \
      | jq -r '.status.overall.state // empty')"
  if [ "${overall_state}" != "green" ] && \
     [ "${overall_state}" != "yellow" ]; then
      echo "Error: Dashboards overall state is '${overall_state}'" \
        "(expected green/yellow), so it is not connected to OpenSearch."
      dump_diagnostics
      exit 1
  fi
  echo "Dashboards overall state is '${overall_state}'" \
    "(connected to OpenSearch)"

  os_resp="$(curl -sk --max-time 10 http://127.0.0.1:9200)"
  os_tagline="$(echo "${os_resp}" | jq -r '.tagline // empty')"
  os_version="$(echo "${os_resp}" | jq -r '.version.number // empty')"
  if [ "${os_tagline}" != \
       "The OpenSearch Project: https://opensearch.org/" ]; then
      echo "Error: OpenSearch did not respond as expected."
      echo "${os_resp}"
      exit 1
  fi
  echo "OpenSearch is up: ${os_version}"

  # --- Prometheus exporter -------------------------------------------------
  wait_for_exporter

  # Dashboards is up and connected, so the exporter must report it as up.
  dashboards_up="$(echo "${exporter_metrics}" \
      | awk '$1 == "opensearch_dashboards_up" {print $2}')"
  if [ "${dashboards_up}" != "1.0" ]; then
      echo "Error: opensearch_dashboards_up is '${dashboards_up}'" \
        "but Dashboards is up and connected to OpenSearch."
      echo "${exporter_metrics}" | grep opensearch_dashboards | tail -20
      dump_diagnostics
      exit 1
  fi
  echo "Exporter reports opensearch_dashboards_up=${dashboards_up}"

  echo "All smoke tests passed."
