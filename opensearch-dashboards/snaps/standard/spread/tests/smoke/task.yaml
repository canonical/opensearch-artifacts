summary: OpenSearch Dashboards Snap Smoke Test

execute: |
  snap_name="opensearch-dashboards"
  status_url="http://localhost:5601/api/status"
  expected_version="$(yq -r '.version' "${PROJECT_PATH}/snap/snapcraft.yaml")"

  if [ -z "${expected_version}" ] || [ "${expected_version}" = "null" ]; then
    echo "FAIL: could not read 'version' from snapcraft.yaml"
    exit 1
  fi

  dump_diagnostics() {
    snap services "${snap_name}" || true
    snap logs "${snap_name}" -n=50 || true
    snap logs opensearch.daemon -n=50 || true
  }

  # The OpenSearch snap configures and starts itself on install, generating
  # the passwords of its users and its certificates.
  passwords="/var/snap/opensearch/common/init_users_pass.yaml"
  password_of() {
    sed -n "s/^${1}: \"\\(.*\\)\"$/\\1/p" "${passwords}"
  }

  retry=0
  until [ -s "${passwords}" ] && [ "$(curl -sk -o /dev/null -w '%{http_code}' \
    https://localhost:9200/.opendistro_security \
    -u "admin:$(password_of admin)")" = "200" ]; do
    retry=$((retry + 1))
    if [ "${retry}" -ge 90 ]; then
      echo "FAIL: OpenSearch backend did not become ready in time"
      dump_diagnostics
      exit 1
    fi
    sleep 2
  done
  admin_password="$(password_of admin)"
  kibanaserver_password="$(password_of kibanaserver)"

  os_resp="$(curl -sk https://localhost:9200 -u "admin:${admin_password}")"
  echo "Backend version: $(echo "${os_resp}" | jq -r '.version.number')"

  # --- Point the snap at the OpenSearch backend ----------------------------
  # The daemon is started at install time against https://localhost:9200 and
  # its configuration lives in $SNAP_COMMON.
  conf="/var/snap/${snap_name}/common/etc/opensearch-dashboards"
  conf="${conf}/opensearch_dashboards.yml"
  os_yq="/snap/${snap_name}/current/usr/bin/yq"

  daemon="${snap_name}.opensearch-dashboards-daemon"
  if ! snap services "${daemon}" | grep -qE "^${daemon} +enabled +active"; then
    echo "FAIL: the daemon was not started at install time"
    dump_diagnostics
    exit 1
  fi

  if [ "$("${os_yq}" -c '."opensearch.hosts"' "${conf}")" != \
      '["https://localhost:9200"]' ]; then
    echo "FAIL: opensearch.hosts does not default to https://localhost:9200"
    exit 1
  fi

  # Trust the OpenSearch CA, then restart the daemon to apply the settings.
  ca="/var/snap/opensearch/common/etc/opensearch/certificates/root-ca.pem"
  snap run "${snap_name}.setup" \
    --opensearch.hosts="localhost" \
    --opensearch-ca="$(cat "${ca}")" \
    --opensearch.username=kibanaserver \
    --opensearch.password="${kibanaserver_password}" \
    --server.host=0.0.0.0
  snap restart "${daemon}"

  echo "=== opensearch_dashboards.yml ==="
  cat "${conf}"

  ca_file="$("${os_yq}" -r '."opensearch.ssl.certificateAuthorities"[0]' \
    "${conf}")"
  if ! cmp -s "${ca}" "${ca_file}" || \
      [ "$("${os_yq}" -r '."opensearch.ssl.verificationMode"' "${conf}")" \
        != "full" ]; then
    echo "FAIL: the OpenSearch CA was not configured"
    exit 1
  fi

  status_resp=""
  resp=""
  retry=0
  while [ "${retry}" -lt 150 ]; do
    resp="$(curl -s --max-time 5 -u "admin:${admin_password}" \
      "${status_url}" || true)"
    state="$(echo "${resp}" | jq -r '.status.overall.state // empty' \
      2>/dev/null || true)"
    if [ "${state}" = "green" ] || [ "${state}" = "yellow" ]; then
      status_resp="${resp}"
      break
    fi
    retry=$((retry + 1))
    sleep 2
  done
  if [ -z "${status_resp}" ]; then
    echo "FAIL: OpenSearch Dashboards did not become ready in time"
    echo "Last response: ${resp}"
    dump_diagnostics
    exit 1
  fi
  echo "Server responded: ${status_resp}"

  services="$(snap services "${snap_name}")"
  echo "${services}"
  for service in opensearch-dashboards-daemon; do
    pattern="^${snap_name}\.${service} +[a-z]+ +active"
    if ! echo "${services}" | grep -qE "${pattern}"; then
      echo "FAIL: snap service '${service}' is not active"
      dump_diagnostics
      exit 1
    fi
  done

  manifest="/snap/${snap_name}/current/usr/share/opensearch-dashboards"
  manifest="${manifest}/manifest.yml"
  snap_version="$(snap list "${snap_name}" | awk 'NR == 2 {print $2}')"
  workload_version="$(yq -r '.build.version' "${manifest}")"

  echo "snapcraft.yaml version: ${expected_version}"
  echo "installed snap version: ${snap_version}"
  echo "workload version:       ${workload_version}"

  if [ "${snap_version}" != "${expected_version}" ]; then
    echo "FAIL: installed snap is '${snap_version}' but snapcraft.yaml" \
      "declares '${expected_version}'"
    exit 1
  fi

  if [ "${workload_version}" != "${expected_version}" ]; then
    echo "FAIL: the OpenSearch Dashboards workload is" \
      "'${workload_version}' but snapcraft.yaml declares" \
      "'${expected_version}'"
    exit 1
  fi

  # --- Integration: Dashboards must be talking to OpenSearch ---------------
  dashboards_version="$(echo "${status_resp}" \
    | jq -r '.version.number // empty')"
  if [ "${dashboards_version}" != "${expected_version}" ]; then
    echo "FAIL: /api/status reports version '${dashboards_version}'" \
      "!= ${expected_version}."
    exit 1
  fi
  echo "Dashboards reports version ${dashboards_version} via /api/status"

  # The overall status only reaches an available state once Dashboards has
  # successfully connected to its OpenSearch backend.
  overall_state="$(echo "${status_resp}" \
    | jq -r '.status.overall.state // empty')"
  if [ "${overall_state}" != "green" ] && \
     [ "${overall_state}" != "yellow" ]; then
    echo "FAIL: Dashboards overall state is '${overall_state}'" \
      "(expected green/yellow), so it is not connected to OpenSearch."
    dump_diagnostics
    exit 1
  fi
  echo "Dashboards overall state is '${overall_state}' (backend connected)"

  # The security plugin redirects unauthenticated browsers to the login page.
  root_resp="$(curl -s -i --max-time 10 http://localhost:5601)"
  if ! echo "${root_resp}" | grep -q "302 Found"; then
    echo "FAIL: Dashboards did not redirect (302) on /."
    echo "${root_resp}" | head -5
    exit 1
  fi
  echo "Dashboards redirects unauthenticated requests"

  # Valid credentials must authenticate against the OpenSearch backend.
  if ! curl -s -i -k -XPOST http://localhost:5601/auth/login \
      --max-time 10 \
      -H 'Accept: application/json' \
      -H 'Content-Type: application/json' \
      -H 'osd-xsrf:true' \
      -d "$(jq -n -c --arg p "${kibanaserver_password}" \
        '{username: "kibanaserver", password: $p}')" \
      | grep -q "200 OK"; then
    echo "FAIL: authentication with valid credentials did not return 200."
    dump_diagnostics
    exit 1
  fi
  echo "Authentication with valid credentials succeeded"

  logfile="/var/snap/${snap_name}/common/var/log/opensearch-dashboards"
  logfile="${logfile}/opensearch_dashboards.log"
  if ! test -s "${logfile}"; then
    echo "FAIL: ${logfile} is missing or empty."
    ls -l "$(dirname "${logfile}")" || true
    exit 1
  fi
  echo "Dashboards is writing to ${logfile}"

  # --- A custom plugin loads the modules of OpenSearch Dashboards ----------
  # Custom plugins live in the revision's data: they must still resolve the
  # packages (@osd/*) and sources (../../../src) of OpenSearch Dashboards.
  plugin_src="$(mktemp -d)"
  plugin_dir="${plugin_src}/opensearch-dashboards/smokeTest"
  mkdir -p "${plugin_dir}/server"
  jq -n --arg v "${expected_version}" '{id: "smokeTest", version: "1.0.0",
    opensearchDashboardsVersion: $v, server: true, ui: false}' \
    > "${plugin_dir}/opensearch_dashboards.json"
  echo '{"name": "smoke-test", "version": "1.0.0"}' \
    > "${plugin_dir}/package.json"
  cat > "${plugin_dir}/server/index.js" << 'EOF'
  const { schema } = require("@osd/config-schema");
  require("../../../src/core/server");
  exports.config = { schema: schema.object({}) };
  exports.plugin = () => ({
    setup(core) {
      core.http.createRouter().get(
        { path: "/api/smoke_test", validate: false,
          options: { authRequired: false } },
        async (context, request, response) =>
          response.ok({ body: { loaded: true } }));
    },
    start() {},
    stop() {},
  });
  EOF
  plugin_zip="/var/snap/${snap_name}/common/smoke-test.zip"
  (cd "${plugin_src}" && python3 -m zipfile -c "${plugin_zip}" \
    opensearch-dashboards)
  snap run "${snap_name}.plugin" install "file://${plugin_zip}"
  snap restart "${daemon}"

  plugin_resp=""
  retry=0
  until [ "${plugin_resp}" = '{"loaded":true}' ]; do
    retry=$((retry + 1))
    if [ "${retry}" -ge 150 ]; then
      echo "FAIL: the custom plugin was not loaded."
      dump_diagnostics
      exit 1
    fi
    sleep 2
    plugin_resp="$(curl -s --max-time 5 \
      http://localhost:5601/api/smoke_test || true)"
  done
  echo "The custom plugin was loaded"

  state="$(curl -s --max-time 5 -u "admin:${admin_password}" "${status_url}" \
    | jq -r '.status.overall.state // empty' 2>/dev/null || true)"
  if [ "${state}" != "green" ] && [ "${state}" != "yellow" ]; then
    echo "FAIL: Dashboards overall state is '${state}' with the custom plugin."
    dump_diagnostics
    exit 1
  fi

  # --- Bundled plugins can not be removed ----------------------------------
  plugins_dir="/var/snap/${snap_name}/current/usr/share/opensearch-dashboards"
  plugins_dir="${plugins_dir}/plugins"
  rc=0
  snap run "${snap_name}.plugin" remove -qc "${conf}" securityDashboards \
    || rc=$?
  if [ "${rc}" -ne 64 ] || [ ! -L "${plugins_dir}/securityDashboards" ]; then
    echo "FAIL: the bundled securityDashboards plugin was removed (rc=${rc})."
    exit 1
  fi
  echo "Bundled plugins can not be removed"

  echo "All smoke tests passed."
